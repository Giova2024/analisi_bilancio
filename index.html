<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RaggruppaPer — Excel GroupBy</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#08080F;
    --surface:#0F0F1C;
    --border:#1C1C2E;
    --accent:#00D4AA;
    --accent2:#FF6B35;
    --text:#E0E0F0;
    --muted:#50506A;
    --blue:#3B82F6;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Syne',sans-serif;
    min-height:100vh;
    padding:36px 24px 64px;
  }

  /* HEADER */
  .header{display:flex;align-items:center;gap:18px;margin-bottom:48px}
  .header-icon{
    width:56px;height:56px;
    background:linear-gradient(135deg,var(--accent),#009E7E);
    border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:26px;box-shadow:0 0 36px rgba(0,212,170,.28);flex-shrink:0
  }
  .header h1{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
  .header h1 span{color:var(--accent)}
  .header p{color:var(--muted);font-family:'DM Mono',monospace;font-size:13px;margin-top:5px}

  /* UPLOAD */
  .upload-zone{
    border:2px dashed var(--border);border-radius:22px;
    padding:60px 32px;text-align:center;cursor:pointer;
    transition:all .25s;background:var(--surface);position:relative;overflow:hidden
  }
  .upload-zone::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 100%,rgba(0,212,170,.05),transparent 60%);
    pointer-events:none
  }
  .upload-zone:hover,.upload-zone.drag-over{
    border-color:var(--accent);background:#0B1A16;
    box-shadow:0 0 48px rgba(0,212,170,.08)
  }
  .upload-zone .ico{font-size:52px;display:block;margin-bottom:18px}
  .upload-zone h2{font-size:21px;font-weight:700;margin-bottom:8px}
  .upload-zone p{color:var(--muted);font-family:'DM Mono',monospace;font-size:13px}
  .upload-zone .accent{color:var(--accent)}
  .file-badge{
    display:inline-flex;align-items:center;gap:9px;
    background:rgba(0,212,170,.1);border:1px solid rgba(0,212,170,.3);
    border-radius:100px;padding:7px 20px;margin-top:20px;
    font-family:'DM Mono',monospace;font-size:13px;color:var(--accent)
  }

  /* LAYOUT */
  .two-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
  @media(max-width:640px){.two-cols{grid-template-columns:1fr}}

  /* PANEL */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px}
  .panel-title{
    font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--muted);margin-bottom:18px;font-family:'DM Mono',monospace;
    display:flex;align-items:center;gap:10px
  }
  .panel-title .icon{font-size:16px}
  .panel-title::after{content:'';flex:1;height:1px;background:var(--border)}

  /* CHIPS */
  .fields-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
  .chip{
    display:flex;align-items:center;gap:9px;padding:9px 13px;
    border-radius:11px;border:1.5px solid var(--border);cursor:pointer;
    transition:all .18s;background:var(--bg);font-size:13px;
    font-family:'DM Mono',monospace;user-select:none;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis
  }
  .chip:hover{border-color:#2A2A42;background:#111120}
  .chip.g-sel{border-color:var(--accent);background:rgba(0,212,170,.08);color:var(--accent)}
  .chip.s-sel{border-color:var(--accent2);background:rgba(255,107,53,.08);color:var(--accent2)}
  .chip.disabled{opacity:.3;cursor:not-allowed}
  .dot{width:8px;height:8px;border-radius:50%;background:#252538;flex-shrink:0;transition:background .18s}
  .chip.g-sel .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .chip.s-sel .dot{background:var(--accent2);box-shadow:0 0 8px var(--accent2)}

  /* LEGEND */
  .legend{display:flex;gap:24px;flex-wrap:wrap;margin-top:24px;margin-bottom:4px}
  .leg-item{display:flex;align-items:center;gap:8px;font-size:12px;font-family:'DM Mono',monospace;color:var(--muted)}
  .leg-dot{width:9px;height:9px;border-radius:50%}

  /* BUTTONS */
  .btn{
    display:inline-flex;align-items:center;gap:10px;padding:13px 28px;
    border-radius:14px;border:none;font-family:'Syne',sans-serif;font-size:15px;
    font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.3px
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),#009E7E);color:#080810;
    box-shadow:0 4px 24px rgba(0,212,170,.28);margin-top:24px;width:100%;justify-content:center
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 32px rgba(0,212,170,.38)}
  .btn-primary:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-export{
    background:linear-gradient(135deg,var(--blue),#1A4ECC);color:#fff;
    box-shadow:0 4px 20px rgba(59,130,246,.25)
  }
  .btn-export:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(59,130,246,.38)}
  .btn-reset{
    background:var(--surface);color:var(--muted);border:1px solid var(--border)
  }
  .btn-reset:hover{border-color:#333350;color:var(--text)}

  /* ERROR */
  .error-msg{
    background:rgba(255,80,80,.07);border:1px solid rgba(255,80,80,.2);
    color:#FF7070;border-radius:11px;padding:10px 16px;
    font-family:'DM Mono',monospace;font-size:12px;margin-top:14px
  }

  /* RESULTS */
  .results-bar{
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:12px;margin-top:36px;margin-bottom:16px
  }
  .results-bar h2{font-size:20px;font-weight:700}
  .badge{
    font-family:'DM Mono',monospace;font-size:12px;
    padding:4px 14px;border-radius:100px;
    background:rgba(0,212,170,.1);color:var(--accent);
    border:1px solid rgba(0,212,170,.2);margin-left:10px
  }
  .export-row{display:flex;gap:12px;flex-wrap:wrap}

  /* TABLE */
  .table-wrap{overflow-x:auto;border-radius:17px;border:1px solid var(--border)}
  table{width:100%;border-collapse:collapse;font-size:13px;font-family:'DM Mono',monospace}
  thead tr{background:#0D0D1C}
  th{
    padding:13px 18px;text-align:left;font-weight:600;font-size:11px;
    letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--border);white-space:nowrap
  }
  th.gh{color:var(--accent)}
  th.sh{color:var(--accent2)}
  td{padding:11px 18px;border-bottom:1px solid #10101A;color:#AAAAC0;white-space:nowrap}
  td.gv{color:var(--text);font-weight:500}
  td.sv{color:var(--accent2)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:rgba(255,255,255,.018)}

  /* TOAST */
  #toast{
    position:fixed;bottom:32px;right:32px;
    background:#0F2218;border:1px solid rgba(0,212,170,.35);
    color:var(--accent);padding:12px 22px;border-radius:14px;
    font-family:'DM Mono',monospace;font-size:13px;z-index:9999;
    box-shadow:0 8px 32px rgba(0,0,0,.5);
    opacity:0;transition:opacity .3s;pointer-events:none
  }
  #toast.show{opacity:1}

  /* EMPTY */
  .empty{text-align:center;padding:56px;color:#282838;font-family:'DM Mono',monospace;font-size:15px}

  /* STATS ROW */
  .stats-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:16px 22px;flex:1;min-width:140px
  }
  .stat-label{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
  .stat-val{font-size:24px;font-weight:800;margin-top:4px}
  .stat-val.g{color:var(--accent)}
  .stat-val.s{color:var(--accent2)}
</style>
</head>
<body>

<div id="app">

  <div class="header">
    <div class="header-icon">⊞</div>
    <div>
      <h1>Raggruppa<span>Per</span></h1>
      <p>Excel GroupBy — aggrega · somma · esporta</p>
    </div>
  </div>

  <!-- UPLOAD -->
  <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <span class="ico">📂</span>
    <h2>Trascina il file Excel qui</h2>
    <p>oppure <span class="accent">clicca per selezionare</span> &nbsp;·&nbsp; .xlsx · .xls · .csv</p>
    <div id="fileBadge" style="display:none" class="file-badge">📄 <span id="fileName"></span></div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none">
  </div>

  <!-- CONFIG -->
  <div id="config" style="display:none">
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--accent)"></div> Raggruppa per (categorie)</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--accent2)"></div> Somma (valori numerici)</div>
    </div>

    <div class="two-cols">
      <div class="panel">
        <div class="panel-title"><span class="icon">▣</span> Campi Raggruppamento</div>
        <div class="fields-grid" id="groupGrid"></div>
      </div>
      <div class="panel">
        <div class="panel-title"><span class="icon">∑</span> Campi da Sommare</div>
        <div class="fields-grid" id="sumGrid"></div>
      </div>
    </div>

    <div id="errorMsg" class="error-msg" style="display:none"></div>

    <button class="btn btn-primary" id="applyBtn" onclick="applyGroupBy()">
      ⊞ &nbsp;Applica Raggruppa Per
    </button>
  </div>

  <!-- RESULTS -->
  <div id="results" style="display:none">
    <div class="results-bar">
      <div>
        <h2>Risultati<span class="badge" id="rowBadge"></span></h2>
      </div>
      <div class="export-row">
        <button class="btn btn-reset" onclick="resetAll()">↺ &nbsp;Ricomincia</button>
        <button class="btn btn-export" onclick="exportExcel()">↓ &nbsp;Esporta Excel</button>
      </div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div class="table-wrap" style="margin-top:20px">
      <table>
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="emptyMsg" class="empty">Carica un file Excel per iniziare ↑</div>
</div>

<div id="toast"></div>

<script>
let allHeaders=[], allRows=[], groupFields=[], sumFields=[], groupedData=[], numericCols=[];

// ── DRAG & DROP ──────────────────────────────────────
const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over')});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{
  e.preventDefault();dz.classList.remove('drag-over');
  const f=e.dataTransfer.files[0];if(f)processFile(f);
});
document.getElementById('fileInput').addEventListener('change',e=>{
  if(e.target.files[0])processFile(e.target.files[0]);
});

// ── FILE PROCESSING ──────────────────────────────────
function processFile(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(!data.length){showError('Il file è vuoto o non contiene dati.');return;}
      allHeaders=Object.keys(data[0]);
      allRows=data;
      numericCols=allHeaders.filter(h=>isNumericCol(h));
      groupFields=[];sumFields=[];groupedData=[];
      document.getElementById('fileName').textContent=file.name+' · '+data.length+' righe · '+allHeaders.length+' colonne';
      document.getElementById('fileBadge').style.display='inline-flex';
      document.getElementById('config').style.display='block';
      document.getElementById('emptyMsg').style.display='none';
      document.getElementById('results').style.display='none';
      renderChips();
      showToast('✓ File caricato: '+file.name);
    }catch(e){showError('Errore nel leggere il file. Assicurati sia un .xlsx valido.');}
  };
  reader.readAsArrayBuffer(file);
}

function isNumericCol(col){
  const vals=allRows.map(r=>r[col]).filter(v=>v!==''&&v!==null&&v!==undefined);
  return vals.length>0&&vals.every(v=>!isNaN(Number(v)));
}

// ── CHIPS ────────────────────────────────────────────
function renderChips(){
  const gg=document.getElementById('groupGrid');
  const sg=document.getElementById('sumGrid');
  gg.innerHTML='';sg.innerHTML='';
  allHeaders.forEach(col=>{
    // Group chip
    const gc=document.createElement('div');
    gc.className='chip'+(groupFields.includes(col)?' g-sel':'');
    gc.innerHTML=`<span class="dot"></span>${col}`;
    gc.title=col;
    gc.onclick=()=>toggleGroup(col);
    gg.appendChild(gc);
    // Sum chip
    const sc=document.createElement('div');
    const isNum=numericCols.includes(col);
    sc.className='chip'+(sumFields.includes(col)?' s-sel':isNum?'':' disabled');
    sc.innerHTML=`<span class="dot"></span>${col}`;
    sc.title=isNum?col:col+' (non numerico)';
    if(isNum)sc.onclick=()=>toggleSum(col);
    sg.appendChild(sc);
  });
}

function toggleGroup(col){
  if(groupFields.includes(col))groupFields=groupFields.filter(c=>c!==col);
  else{groupFields.push(col);sumFields=sumFields.filter(c=>c!==col);}
  groupedData=[];document.getElementById('results').style.display='none';
  hideError();renderChips();
}

function toggleSum(col){
  if(sumFields.includes(col))sumFields=sumFields.filter(c=>c!==col);
  else{sumFields.push(col);groupFields=groupFields.filter(c=>c!==col);}
  groupedData=[];document.getElementById('results').style.display='none';
  hideError();renderChips();
}

// ── GROUP BY ─────────────────────────────────────────
function applyGroupBy(){
  if(!groupFields.length){showError('Seleziona almeno un campo da raggruppare (verde).');return;}
  if(!sumFields.length){showError('Seleziona almeno un campo da sommare (arancione).');return;}
  hideError();

  const map={};
  allRows.forEach(row=>{
    const key=groupFields.map(f=>String(row[f])).join('\x00');
    if(!map[key]){
      const base={};
      groupFields.forEach(f=>base[f]=row[f]);
      sumFields.forEach(f=>base[f]=0);
      map[key]=base;
    }
    sumFields.forEach(f=>map[key][f]+=Number(row[f])||0);
  });
  groupedData=Object.values(map);
  renderResults();
  showToast('✓ Raggruppamento completato: '+groupedData.length+' gruppi');
}

// ── RENDER RESULTS ────────────────────────────────────
function renderResults(){
  document.getElementById('rowBadge').textContent=groupedData.length+' gruppi';
  document.getElementById('results').style.display='block';

  // Stats
  const sr=document.getElementById('statsRow');
  sr.innerHTML='';
  const s1=document.createElement('div');s1.className='stat-card';
  s1.innerHTML=`<div class="stat-label">Righe originali</div><div class="stat-val g">${allRows.length.toLocaleString('it-IT')}</div>`;
  const s2=document.createElement('div');s2.className='stat-card';
  s2.innerHTML=`<div class="stat-label">Gruppi trovati</div><div class="stat-val g">${groupedData.length.toLocaleString('it-IT')}</div>`;
  sr.appendChild(s1);sr.appendChild(s2);
  sumFields.forEach(f=>{
    const tot=groupedData.reduce((a,r)=>a+r[f],0);
    const sc=document.createElement('div');sc.className='stat-card';
    sc.innerHTML=`<div class="stat-label">Totale ${f}</div><div class="stat-val s">${fmtNum(tot)}</div>`;
    sr.appendChild(sc);
  });

  // Table
  const head=document.getElementById('tableHead');
  head.innerHTML='';
  groupFields.forEach(f=>{const th=document.createElement('th');th.className='gh';th.textContent=f;head.appendChild(th);});
  sumFields.forEach(f=>{const th=document.createElement('th');th.className='sh';th.textContent='∑ '+f;head.appendChild(th);});

  const body=document.getElementById('tableBody');
  body.innerHTML='';
  groupedData.forEach(row=>{
    const tr=document.createElement('tr');
    groupFields.forEach(f=>{const td=document.createElement('td');td.className='gv';td.textContent=row[f];tr.appendChild(td);});
    sumFields.forEach(f=>{const td=document.createElement('td');td.className='sv';td.textContent=fmtNum(row[f]);tr.appendChild(td);});
    body.appendChild(tr);
  });
}

// ── EXPORT ───────────────────────────────────────────
function exportExcel(){
  if(!groupedData.length)return;
  // Build friendly column names
  const exportRows=groupedData.map(row=>{
    const obj={};
    groupFields.forEach(f=>obj[f]=row[f]);
    sumFields.forEach(f=>obj['Somma_'+f]=row[f]);
    return obj;
  });
  const ws=XLSX.utils.json_to_sheet(exportRows);

  // Style header row width
  const cols=Object.keys(exportRows[0]);
  ws['!cols']=cols.map(c=>({wch:Math.max(c.length+4,14)}));

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Raggruppato');
  const now=new Date();
  const ts=now.toISOString().slice(0,10);
  XLSX.writeFile(wb,'raggruppato_'+ts+'.xlsx');
  showToast('✓ File Excel esportato!');
}

// ── UTILS ────────────────────────────────────────────
function fmtNum(n){
  if(Number.isInteger(n))return n.toLocaleString('it-IT');
  return n.toLocaleString('it-IT',{maximumFractionDigits:2});
}
function showError(msg){
  const el=document.getElementById('errorMsg');
  el.textContent='⚠ '+msg;el.style.display='block';
}
function hideError(){document.getElementById('errorMsg').style.display='none';}
function resetAll(){
  allHeaders=[];allRows=[];groupFields=[];sumFields=[];groupedData=[];numericCols=[];
  document.getElementById('config').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('fileBadge').style.display='none';
  document.getElementById('emptyMsg').style.display='block';
  document.getElementById('fileInput').value='';
  hideError();
}
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}
</script>
</body>
</html>
